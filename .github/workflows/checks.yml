name: checks

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; grant nothing else.
permissions:
  contents: read

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pin to the devcontainer's minor so CI verifies the same runtime
          # the plugin is developed against (stdlib-only, but parser/dict
          # ordering details still deserve one truth).
          python-version: '3.12'

      - name: Unit tests (plugin)
        run: python3 plugin/run_tests.py

      - name: Docs audit (doctrine_docs/ corpus)
        run: CLAUDE_PLUGIN_ROOT="$PWD/plugin" python3 plugin/scripts/docs-audit.py --root doctrine_docs --fail-on error

      # Methodology residues (ADR-068): import boundaries between entry
      # scripts and shared cores, duplicated literal definitions, oversize
      # functions/files, unparseable targets. Errors gate the merge;
      # advisories are printed for humans to weigh (PROC-001).
      - name: Code audit (methodology residues)
        run: python3 plugin/scripts/code-audit.py --fail-on error

      # Schema gate (#91): the SessionEnd audit covers cross-document integrity,
      # but per-file schema checks (missing keys, bad status, id/filename
      # mismatch, banned synonyms) only ran in the PostToolUse hook — so a
      # document entering through a hook-bypassing path (GitHub web UI, another
      # agent, a bulk script) reached main uninspected. This runs the exact
      # per-file linter over the whole corpus and fails on any ERROR, reusing the
      # single rule source (_registry) — no duplication.
      - name: Docs linter schema gate (batch)
        run: CLAUDE_PLUGIN_ROOT="$PWD/plugin" python3 plugin/scripts/docs-linter.py --batch doctrine_docs

      - name: Projection drift (overview / icd-index / context-map)
        run: python3 plugin/scripts/render-projection.py all --check --docs-root doctrine_docs

      # Bring the reader-facing root docs into the governed term-check pass.
      # docs-audit only scans doctrine_docs/, so README.md, CONTRIBUTING.md and
      # plugin/README.md would otherwise never be checked for banned
      # synonyms / calques (§1). term-check always exits 0 (it is advisory in
      # the hook chain), so gate on its output. spec/doctrine.ja.md is
      # intentionally excluded: it carries the §1 vocabulary tables by
      # definition and would self-flag.
      - name: Term-check root docs (README, CONTRIBUTING, plugin/README, CLAUDE, AGENTS)
        run: |
          out=$(CLAUDE_PLUGIN_ROOT="$PWD/plugin" python3 plugin/scripts/term-check.py README.md CONTRIBUTING.md plugin/README.md CLAUDE.md AGENTS.md)
          echo "$out"
          if echo "$out" | grep -q '\[ERROR\]'; then
            echo "::error::term-check found banned-synonym/calque ERRORs in root docs"
            exit 1
          fi

      # Release integrity gate (ADR-071 / SPEC-027): the CHANGELOG's top
      # versioned section must match the canonical version (plugin.json) and
      # carry a date. On pull requests, a diff touching plugin/ must also touch
      # CHANGELOG.md — escape hatch: "[no-changelog]" in the PR title (explicit,
      # visible; no silent bypass). scripts/release-check.py is repo-local
      # self-application, stdlib-only, not part of the distributed plugin.
      - name: Release integrity (version ↔ CHANGELOG)
        if: github.event_name != 'pull_request'
        run: python3 scripts/release-check.py

      - name: Release integrity (version ↔ CHANGELOG + record duty)
        if: github.event_name == 'pull_request'
        env:
          RELEASE_CHECK_PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/release-check.py --diff-base "$BASE_SHA"
